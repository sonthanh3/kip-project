spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/mockbank
    username: postgres
    password: mockbank_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
